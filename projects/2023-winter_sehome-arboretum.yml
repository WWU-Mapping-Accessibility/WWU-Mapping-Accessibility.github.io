summary: 'Students tried to map accessibility conditions across the entire Sehome Hill Arboretum:
  trail grades, obstacles and entrances. They found that only one trail, the Huntoon Trail,
  might be accessible to people with mobility disabilities. That finding set the focus for
  the next three cohorts.'

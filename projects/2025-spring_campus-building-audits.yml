summary: MAP's first project beyond the arboretum. The team built an automated R workflow
  that turns building-audit survey responses into formats WWU Facilities and ArcGIS Pro can
  use, so the university's accessibility data can be updated quickly. They also made annotated
  floor plans of Old Main and Kaiser Borsari Hall showing entrances, ramps, elevators, restrooms
  and obstacles.

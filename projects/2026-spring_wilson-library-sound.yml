summary: For neurodivergent and sensory-sensitive students, the team recorded one minute of
  audio in each of 18 public rooms on Wilson Library's floors 2 and 5 at the busiest hour.
  Floor 2 averaged -43.0 LUFS, about 11 LUFS louder than quiet-study Floor 5. Their dashboard
  links each room to its recording, so you can hear a space as well as see its loudness.

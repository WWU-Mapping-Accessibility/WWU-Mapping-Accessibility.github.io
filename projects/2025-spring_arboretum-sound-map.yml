summary: Students recorded sound and took 360-degree photos at eleven popular spots in Sehome Hill
  Arboretum, and built a story map where you can look around each spot while hearing it. People with
  visual or mobility disabilities, or anyone who cannot visit, can explore the arboretum this way
  and decide where to go. Comparing average sound levels in decibels showed which parts of the arboretum
  are noisier than others.

summary: This senior project asked how WWU plans for people with mobility disabilities when there
  is snow and ice. Comparing campus snow-removal priorities with accessible parking and housing,
  it found that 5 parking lots with accessible parking spaces have no prioritized accessible snow
  route, and no residence hall complex has proper snow-route priority for disabled people. Interviews
  with students with mobility disabilities added first-hand accounts of getting around campus in
  winter.

summary: Student interns walked WWU's designated accessible routes and wrote step-by-step directions
  from accessible parking lots and bus stops to accessible building entrances, and back. The directions
  give screen-reader users information the campus map does not, and a prototype showed how to add
  them to the map. Writing them revealed several places on campus with no truly accessible route
  or entrance. Not every building is covered yet, and the directions still need review by the people
  who will use them.

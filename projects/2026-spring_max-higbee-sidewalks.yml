summary: With the Max Higbee Center, which runs recreation programs for people with developmental
  disabilities, the team mapped slope and surface roughness on 440 downtown sidewalk segments.
  About a quarter exceed the 5% ADA slope threshold, and 49% are at least moderately rough.
  The main product is a 30 by 40 inch magnetic poster map that staff and participants use
  to plan outings.

summary: Building on the fall 2023 route directions, this project looked at how other tools describe
  places to blind and low-vision people, including Microsoft Soundscape, tactile maps and Western
  Libraries' Find a Space, and wrote guidelines for plain-text descriptions of maps and routes. The
  goal is for screen-reader users to get the same information as someone reading the map. The project
  also compared two page layouts for showing directions in a campus map prototype.

title: 'Students for Accessible Western: a community building audit'
term: Spring 2025
track: senior project
theme: buildings
status: draft
team: []
summary: Most WWU buildings were designed before universal design and the Americans with Disabilities
  Act shaped how buildings are made. This senior project organized Students for Accessible Western
  (SAW), a community audit of academic buildings run with the student advocacy group This Is Not
  Accessible (TINA). R scripts turn audit responses into formats Facilities can use and ArcGIS Pro
  can map. Too few audits came in to show where barriers cluster, but the project showed that community
  audits can link students' everyday experience to Facilities, and its survey, guidelines and scripts
  are ready for future rounds.

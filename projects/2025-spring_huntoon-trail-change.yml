term: Spring 2025
track: ENVS 421
theme: outdoor
status: draft
names_public: false
team: []
summary: Students surveyed the Huntoon Trail in Sehome Hill Arboretum again, using ArcGIS Field Maps,
  GPS and LiDAR scans made with a phone, and measured slope with LiDAR data from the Washington Department
  of Natural Resources. Comparing the results with the 2024 surveys shows how the trail is changing.
  The team found that repairing worn and broken surfaces, and adding benches and resting spots on
  the steeper sections, would make the trail usable by more people.

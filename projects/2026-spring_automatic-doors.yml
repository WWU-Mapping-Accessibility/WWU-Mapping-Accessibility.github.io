id: 2026-spring_automatic-doors
title: Automatic door accessibility at WWU
term: Spring 2026
track: ENVS 421
theme: buildings
status: draft
names_public: false
team: []
summary: The team measured 47 interior automatic doors across campus buildings, recording
  push-button height, closing speed and where each door leads. About three-quarters lead to
  restrooms; only one serves a lecture hall and one leads outside. Only 4 of 18 single-person
  restrooms they mapped have an automatic button. They published a web map, a story map with
  a screen-reader text version, and a form for reporting problems.

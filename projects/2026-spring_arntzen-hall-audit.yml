summary: The team digitized every floor of Arntzen Hall and built a phone form so a volunteer
  with no GIS experience can audit a building room by room. A Python script generates the
  best ADA route from accessible entrances and elevators to every room. On a 1 to 5 scale,
  every room type had at least one category averaging below 3, including classroom chairs
  (2.1) and bathroom internal space (2.0).

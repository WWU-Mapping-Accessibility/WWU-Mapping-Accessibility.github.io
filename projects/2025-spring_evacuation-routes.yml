names_public: false
team: []
summary: This senior project asked how fire evacuation procedures in WWU residence halls account
  for students with physical disabilities. A literature review and conversations with key campus
  staff found narrow stairwells, too little assistive equipment such as evacuation chairs, and gaps
  in how procedures are communicated. Fire drills often leave disabled students unprepared for a
  real emergency. Mapping the assembly point for each residence hall showed where changes could keep
  students with physical disabilities safer during an evacuation.

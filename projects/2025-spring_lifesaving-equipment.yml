title: Finding defibrillators and naloxone on campus
term: Spring 2025
track: senior project
theme: safety
status: draft
names_public: false
team: []
summary: This project mapped where to find automated external defibrillators (AEDs), naloxone (Narcan)
  and first-aid kits on campus, and checked the campus map against what is really there. Of the 34
  AEDs WWU maintains, 31 were on the map, but only 8 of those 31 were marked within 5 feet of their
  real location, so many were hard to find. The project remapped every AED to within about 5 feet
  and wrote directions to each one, including the quickest accessible route, for WWU's interactive
  map.
